# Corridor — testnet SEP-6 withdrawal via SDF reference test anchor (testanchor.stellar.org).
#
# Endpoints confirmed 2026-10-17 against published stellar.toml:
#   TRANSFER_SERVER: https://testanchor.stellar.org/sep6
#   TRANSFER_SERVER_SEP0024: https://testanchor.stellar.org/sep24
#   WEB_AUTH_ENDPOINT: https://testanchor.stellar.org/auth
#   KYC_SERVER: https://testanchor.stellar.org/sep12
#   ANCHOR_QUOTE_SERVER: https://testanchor.stellar.org/sep38
#
# SEP-6 GET /info advertises deposit and withdrawal for SRT, USDC, native.
# `@corridor/sep6` drives a `dest.protocol: sep6` corridor, and `liveness()` reads
# the SEP-6 `transfer_server` for it, so `corridor plan` reports this lane VERIFIED
# on the strength of the endpoints below, which were read from the anchor's
# published stellar.toml.
#
# Payout attempted 2026-11-22 from funded testnet account
# GDE2U4B6KFCLPOYDWU6EEVEYUZDXNY3NWWDJPB4WJUFYLYCPEFH6FZ7S. SEP-10 and SEP-12
# succeeded (customer ACCEPTED) and GET /sep6/withdraw returned transaction
# 19a2872f-278c-4867-9931-7e7f82ee67a6, but it stayed `incomplete` with no
# withdraw_anchor_account or withdrawal memo, so no Stellar payment could be
# sent. GET /sep6/withdraw-exchange rejects USDC with HTTP 400 ("invalid
# operation for asset stellar:USDC:GBBD47IF…"), and the transaction's
# more_info_url is the SEP-24 reference UI, whose business-server calls return
# 401 for the SEP-6 more-info token. Seven withdrawals (USDC and native, both
# funding methods) all stayed `incomplete`. No proof was earned; this file
# records the attempt, not a completed payout.
id: testanchor-sep6
status_note: "SDF Test Anchor (testanchor.stellar.org) on testnet via SEP-6. Endpoints read from its stellar.toml 2026-10-17. Payout attempted 2026-11-22: SEP-10 and SEP-12 succeeded and /sep6/withdraw returned transaction 19a2872f-278c-4867-9931-7e7f82ee67a6, but it stayed incomplete with no withdraw_anchor_account and no Stellar payment was possible; /sep6/withdraw-exchange rejects USDC (HTTP 400) and the more_info_url rejects the SEP-6 token (401). No proof; plan reports it VERIFIED from those endpoints alone."

source:
  name: Testnet Sending Anchor
  asset: USDC
  endpoints:
    home_domain: sending-anchor.example

dest:
  name: SDF Test Anchor (testnet)
  asset: "iso4217:USD"
  protocol: sep6
  endpoints:
    home_domain: testanchor.stellar.org
    transfer_server: https://testanchor.stellar.org/sep6
    web_auth: https://testanchor.stellar.org/auth
    kyc_server: https://testanchor.stellar.org/sep12
    quote_server: https://testanchor.stellar.org/sep38
    endpoints_verified_at: "2026-10-17"

fx:
  path: ["USD", "USDC", "USD"]
  quote_source: sep38
  who_holds_risk: receiving_anchor
  quote_ttl_seconds: 60

compliance:
  source_jurisdiction: US
  dest_jurisdiction: US
  travel_rule_profile: default

settlement:
  bridge_asset: USDC
  network: testnet
  asset_issuer: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5

recovery:
  max_retries: 3
  timeout_seconds: 900
  rollback: refund_sender
